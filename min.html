
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>djcj</title>
    <link rel="stylesheet" href="./min.css">
</head>

<body>

    <div class="page-container container">

        <header class="site-header">
            <div class="header-content container">

                <img src="images/Group 3.png" alt="Logo">

                <nav class="navigation">
                    <p style="opacity: 0.7;">отзывы</p>
                    <p style="opacity: 0.7;">что это?</p>
                    <p style="opacity: 0.7;">контакты</p>
                </nav>

            </div>
        </header>

        <main>

            <section class="hero-section">

                <div class="hero-content container">

                    <div class="hero-title">
                        <h1 style="font-size: 50px;">
                            Инновационные <br>
                        </h1>
                    </div>

                    <div class="hero-image">
                        <img width="300px" src="images/коврф 1.png" alt="Автомобильные коврики">
                    </div>

                </div>

            </section>

            <div class="application-form">

                <h1 style="text-align: center;">ФОРМА ЗАЯВКИ</h1>

                <form class="user-form" action="">

                    <input
                        placeholder="Ваше имя"
                        class="user-input"
                        type="text"
                    >

                    <input
                        placeholder="Ваш e-mail"
                        class="user-input"
                        type="text"
                    >

                </form>

                <form class="message-form" action="">

                    <input
                        placeholder="Ваше сообщение (марка автомобиля, цвет ковриков, номер телефона)"
                        class="message-input"
                        type="text"
                    >

                </form>

                <button class="send-button">отправить</button>

            </div>

        </main>

    </div>

</body>

</html>
